<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">

<title>Auto Target Trainer XR</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  font-family:Arial,sans-serif;
  background:#070a12;
  color:white;
  touch-action:none;
}

body{
  padding-top:env(safe-area-inset-top);
  padding-bottom:env(safe-area-inset-bottom);
}

.app{
  width:100%;
  height:100%;
  display:flex;
  flex-direction:column;
  padding:16px;
  gap:12px;
}

header{
  text-align:center;
}

header h1{
  margin:5px 0;
  font-size:26px;
}

header p{
  margin:0;
  color:#8f9bb3;
  font-size:13px;
}

.stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
}

.stat{
  background:#111725;
  border:1px solid #202a40;
  border-radius:14px;
  padding:9px 4px;
  text-align:center;
}

.stat span{
  display:block;
  color:#7f8ba3;
  font-size:11px;
}

.stat b{
  display:block;
  margin-top:3px;
  font-size:19px;
}

.controls{
  background:#101522;
  border:1px solid #202a40;
  border-radius:16px;
  padding:12px;
}

label{
  display:flex;
  justify-content:space-between;
  font-size:13px;
  color:#aab4c8;
  margin-bottom:7px;
}

input[type="range"]{
  width:100%;
  accent-color:#39f5a4;
}

button{
  border:0;
  border-radius:12px;
  padding:12px;
  font-size:15px;
  font-weight:bold;
  color:white;
  background:#202a3d;
}

#start{
  width:100%;
  margin-top:10px;
  background:#39f5a4;
  color:#06110c;
}

.arena{
  position:relative;
  flex:1;
  min-height:250px;
  overflow:hidden;
  border-radius:22px;
  border:1px solid #26324a;
  background:
    radial-gradient(circle at center,#172038 0,#0a0e18 65%);
}

.crosshair{
  position:absolute;
  width:32px;
  height:32px;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  pointer-events:none;
  opacity:.65;
}

.crosshair:before,
.crosshair:after{
  content:"";
  position:absolute;
  background:#7f8ba3;
}

.crosshair:before{
  width:32px;
  height:1px;
  top:15px;
  left:0;
}

.crosshair:after{
  height:32px;
  width:1px;
  left:15px;
  top:0;
}

.target{
  position:absolute;
  width:62px;
  height:62px;
  border-radius:50%;
  background:#ff405d;
  border:4px solid white;
  box-shadow:
    0 0 12px #ff405d,
    0 0 28px rgba(255,64,93,.5);
  transform:translate(-50%,-50%);
  display:none;
  z-index:5;
}

.target:after{
  content:"";
  position:absolute;
  width:14px;
  height:14px;
  border-radius:50%;
  background:white;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
}

.info{
  text-align:center;
  color:#77839a;
  font-size:12px;
}

.overlay{
  position:absolute;
  inset:0;
  background:rgba(4,7,13,.92);
  display:none;
  align-items:center;
  justify-content:center;
  text-align:center;
  z-index:20;
}

.result{
  width:85%;
  background:#111827;
  border:1px solid #293650;
  border-radius:20px;
  padding:25px;
}

.result h2{
  margin-top:0;
}

.result .big{
  font-size:40px;
  font-weight:bold;
  color:#39f5a4;
}

.result button{
  width:100%;
  margin-top:15px;
  background:#39f5a4;
  color:#06110c;
}

@media(max-height:650px){
  header h1{font-size:21px}
  .app{padding:10px;gap:8px}
  .controls{padding:8px}
  .stat{padding:6px}
}
</style>
</head>

<body>

<div class="app">

<header>
  <h1>🎯 Auto Target Trainer XR</h1>
  <p>Simulation indépendante • iPhone XR</p>
</header>

<div class="stats">
  <div class="stat">
    <span>Score</span>
    <b id="score">0</b>
  </div>

  <div class="stat">
    <span>Hits</span>
    <b id="hits">0</b>
  </div>

  <div class="stat">
    <span>Temps</span>
    <b id="time">30</b>
  </div>
</div>

<div class="controls">

  <label>
    <span>Vitesse Auto-Target</span>
    <b id="speedValue">50%</b>
  </label>

  <input
    id="speed"
    type="range"
    min="10"
    max="100"
    value="50"
  >

  <label style="margin-top:12px">
    <span>Taille de la cible</span>
    <b id="sizeValue">62px</b>
  </label>

  <input
    id="size"
    type="range"
    min="35"
    max="90"
    value="62"
  >

  <button id="start">COMMENCER</button>

</div>

<div class="arena" id="arena">

  <div class="crosshair"></div>

  <div class="target" id="target"></div>

  <div class="overlay" id="overlay">
    <div class="result">
      <h2>Session terminée 🎯</h2>

      <div class="big" id="finalScore">0</div>

      <p>Score</p>
      <p id="finalHits">Hits : 0</p>

      <button id="again">REJOUER</button>
    </div>
  </div>

</div>

<div class="info">
  الهدف كيتحرك بوحدو — لمس الهدف باش تجمع النقاط.
</div>

</div>

<script>

const arena = document.getElementById("arena");
const target = document.getElementById("target");

const scoreEl = document.getElementById("score");
const hitsEl = document.getElementById("hits");
const timeEl = document.getElementById("time");

const speed = document.getElementById("speed");
const size = document.getElementById("size");

const speedValue = document.getElementById("speedValue");
const sizeValue = document.getElementById("sizeValue");

const startBtn = document.getElementById("start");
const overlay = document.getElementById("overlay");

const finalScore = document.getElementById("finalScore");
const finalHits = document.getElementById("finalHits");

const again = document.getElementById("again");

let score = 0;
let hits = 0;
let timeLeft = 30;

let running = false;
let timer = null;
let moveTimer = null;

let targetX = 0;
let targetY = 0;

function updateSettings(){

  speedValue.textContent = speed.value + "%";
  sizeValue.textContent = size.value + "px";

  target.style.width = size.value + "px";
  target.style.height = size.value + "px";
}

speed.addEventListener("input", updateSettings);
size.addEventListener("input", updateSettings);

updateSettings();


function randomPosition(){

  const rect = arena.getBoundingClientRect();

  const padding = Number(size.value) / 2 + 10;

  targetX =
    padding +
    Math.random() *
    (rect.width - padding * 2);

  targetY =
    padding +
    Math.random() *
    (rect.height - padding * 2);

  target.style.left = targetX + "px";
  target.style.top = targetY + "px";
}


function moveTarget(){

  if(!running) return;

  randomPosition();

  /*
    Speed élevée = mouvement plus rapide
  */

  const speedPercent = Number(speed.value);

  const delay =
    1100 - (speedPercent * 8);

  clearTimeout(moveTimer);

  moveTimer = setTimeout(
    moveTarget,
    Math.max(180, delay)
  );
}


function startGame(){

  clearInterval(timer);
  clearTimeout(moveTimer);

  score = 0;
  hits = 0;
  timeLeft = 30;

  running = true;

  scoreEl.textContent = score;
  hitsEl.textContent = hits;
  timeEl.textContent = timeLeft;

  overlay.style.display = "none";
  target.style.display = "block";

  randomPosition();
  moveTarget();

  timer = setInterval(() => {

    timeLeft--;

    timeEl.textContent = timeLeft;

    if(timeLeft <= 0){
      endGame();
    }

  },1000);
}


function endGame(){

  running = false;

  clearInterval(timer);
  clearTimeout(moveTimer);

  target.style.display = "none";

  finalScore.textContent = score;
  finalHits.textContent = "Hits : " + hits;

  overlay.style.display = "flex";
}


target.addEventListener("pointerdown", function(e){

  e.preventDefault();

  if(!running) return;

  hits++;

  /*
    كل إصابة = نقاط
    والسرعة كتزيد قيمة النقاط شوية
  */

  const speedBonus =
    Math.round(Number(speed.value) / 20);

  score += 10 + speedBonus;

  scoreEl.textContent = score;
  hitsEl.textContent = hits;

  /*
    من بعد كل إصابة،
    الهدف كيتبدل المكان بسرعة.
  */

  randomPosition();
});


arena.addEventListener("pointerdown", function(e){

  if(!running) return;

  if(e.target === arena){

    /*
      Miss
    */

    score = Math.max(0, score - 2);

    scoreEl.textContent = score;
  }
});


startBtn.addEventListener("click", startGame);

again.addEventListener("click", startGame);

</script>

</body>
</html>
